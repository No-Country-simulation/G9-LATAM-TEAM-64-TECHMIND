# TechMind — despliegue completo en una sola máquina.
#
# Cuatro contenedores en una red privada. Solo `web` publica puertos al
# exterior: Postgres, el backend y el ml-service no son alcanzables desde
# internet, únicamente desde dentro de esta red.
#
# Los servicios se llaman entre ellos por nombre (postgres, backend,
# ml-service); Docker resuelve esos nombres a las IPs internas.

services:
  postgres:
    image: postgres:16-alpine
    container_name: techmind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Sin este volumen, los datos se pierden al recrear el contenedor.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build: ./ml-service
    container_name: techmind-ml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 20s
      timeout: 5s
      retries: 5
      # Cargar el modelo lleva unos segundos; sin este margen el contenedor
      # se marcaría como no saludable antes de estar listo.
      start_period: 40s

  backend:
    build: ./backend
    container_name: techmind-api
    restart: unless-stopped
    environment:
      # `postgres` y `ml-service` son los nombres de servicio de arriba.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      ML_SERVICE_URL: http://ml-service:8000
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_started

  web:
    build: ./frontend
    container_name: techmind-web
    restart: unless-stopped
    ports:
      # Única puerta al exterior. Con HTTPS se añadiría "443:443".
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
