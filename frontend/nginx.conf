server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La subida de documentos permite hasta 10 MB. El límite por defecto de
    # nginx es 1 MB, así que sin esta línea los archivos grandes reciben un 413
    # antes de llegar al backend.
    client_max_body_size 12M;

    # Compresión de los estáticos. El bundle baja de ~320 kB a ~100 kB.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los assets llevan hash en el nombre, así que se pueden cachear para
    # siempre: si cambian, cambia el nombre del archivo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Rutas de la API: se reenvían al contenedor del backend por la red interna
    # de Docker. "backend" es el nombre del servicio en docker-compose.yml, no
    # una IP: Docker lo resuelve.
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El análisis pasa por el modelo de ML y puede tardar. El timeout por
        # defecto de nginx es 60 s; se sube para no cortar peticiones lentas.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }

    # Cualquier otra ruta devuelve el index.html. Es lo que hace funcionar a
    # react-router: /biblioteca y /contenido/5 no existen como archivos, los
    # resuelve el navegador. Sin esta línea, recargar en esas rutas da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
