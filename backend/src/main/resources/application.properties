# PostgreSQL Configuration (Railway)
spring.datasource.url=jdbc:postgresql://altaria.proxy.rlwy.net:48151/railway
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración Hibernate - Forzando UTC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.use_jdbc_metadata_defaults=false
spring.datasource.hikari.data-source-properties.timezone=UTC

# Cambiamos puerto para evitar conflictos
server.port=8081
