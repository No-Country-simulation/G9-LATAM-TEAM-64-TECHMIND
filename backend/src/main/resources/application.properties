# PostgreSQL Configuration (Railway) - valores via variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Configuración Hibernate - Forzando UTC
spring.jpa.hibernate.ddl-auto=update
# Ponlo a true solo para depurar: en producción llena los logs y cuesta memoria.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.use_jdbc_metadata_defaults=false
spring.datasource.hikari.data-source-properties.timezone=UTC

# Cambiamos puerto para evitar conflictos
server.port=8081

# Subida de documentos. Sin esto, Spring corta en 1 MB y la subida falla con un
# 413 antes siquiera de llegar al controlador.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Un hilo bloqueado esperando al ml-service no puede quedarse ahí para siempre.
spring.mvc.async.request-timeout=30s

# Pool de conexiones. Pequeño a propósito: el contenedor tiene poca memoria y
# cada conexión cuesta. Y si el pool se agota, mejor fallar en 10 segundos con
# un error claro que dejar la petición esperando los 30 de por defecto.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.leak-detection-threshold=20000

# --- Diagnóstico ------------------------------------------------------------
# Nuestras propias trazas: entrada y salida de cada petición, y los tiempos de
# cada etapa del procesado.
logging.level.com.techmind=INFO

# Hikari en DEBUG informa del estado del pool. Si ves "Timeout failure ...
# stats (total=5, active=5, idle=0, waiting=3)", el pool está seco.
logging.level.com.zaxxer.hikari=DEBUG

# Descomenta solo si hace falta ver el tráfico HTTP con el ml-service.
# Es MUY ruidoso.
# logging.level.reactor.netty.http.client=DEBUG

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{0} - %msg%n
